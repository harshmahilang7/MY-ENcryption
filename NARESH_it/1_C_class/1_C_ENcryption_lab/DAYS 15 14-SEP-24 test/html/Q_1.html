  <body>

      <h1>Student Information Table</h1>

          <th colspan="3">Subject</th>
          <th rowspan="2">Grade</th>

          <th>Science</th>
          <th>English</th>
        </tr>

          <td>John Due</td>
          <td>Maths</td>
          <td>Science</td>
          <td>English</td>

        </tr>
        <tr>
          <td rowspan="2">John Smith</td>
          <td>Maths</td>
          <td>Science</td>
          <td>English</td>
          <td>B</td>
        </tr>
        <tr>
          <td colspan="3">
            <ul>
              <li>Completed all assignment</li>
              <li>Participated in Science fair</li>
            </ul>
          </td>
        </tr>
        <tr>
          <td rowspan="2">John Smith</td>
          <td colspan="3">
            <ol>
              <li>Maths -90%</li>
              <li>Science - 80%</li>
              <li>English -88%</li>
            </ol>
          </td>
          <td>A-</td>
        </tr>
      </table>
