<!-- Que 2 :
=======

Write a JavaScript program to check whether a given integer is a palindrome. A number is considered a palindrome if the reverse of the number is equal to the original number. 
The program should prompt the user to enter an integer, reverse the number, and then compare it to the original number to determine if it is a palindrome.

Sample input  : Enter an integer: 121
Sample output : 121 is palindrome number.

Sample input  : Enter an integer: 1121 
Sample output : 1121 is not palindrome number.

==================================================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x=123;
        let rev=0;
        let c=x;
        while (c!=0) 
        {
            rev=rev*10+c%10;
            c=Math.floor(c/10);
        }

        if(rev==x)
        {
            document.write(`${x} is palindrome number.`);
            
        }
        else
        document.write(`${x} is not palindrome number.`);
    </script>
</body>
</html>
