<!-- ===============
Q 1 )
	Write a JavaScript program to check the number is even or odd by using Switch Case.

	Sample input : 12
	Sample output : even

	Sample input : 11
	Sample output : odd

==================================================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x=7;
        switch (x%2==0) {
            case (true):
                document.write("even");
                break;
            case (false):
                document.write("odd");
                break;
            default:
                document.write("0");
                break;
        }
    </script>
    
</body>
</html>
