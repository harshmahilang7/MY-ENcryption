<!-- Que 4 : 
=======

Write a JavaScript program to find the second largest element in an array.

Sample input : 
Enter the number of elements in the array: 10
Enter 10 elements:  3 4 1 9 8 88 9 88 88 1

Sample output :
Second largest element = 9

========================================================================================== -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let a = [3, 4, 1, 9, 8, 88, 9, 88, 88, 1];

      document.write(`<h1>
Write a JavaScript program to find the second largest element in an array.</h1>`);
      document.write(`<h3>the array is -: ${a}</h3>`);

      for (let i = 0; i < a.length; i++) {
        for (let j = i + 1; j < a.length; j++) {
          if (a[i] > a[j]) {
            let temp = a[j];
            a[j] = a[i];
            a[i] = temp;
          }
        }
      }

      document.write(`the last elemnet is `);
      for (let i = a.length - 1; i > 0; i--) {
        if (a[i] != a[i - 1]) 
        {
          document.write(`${a[i-1]}`);
          break;
        }
      }
    //   document.write(a);
    </script>
  </body>
</html>
