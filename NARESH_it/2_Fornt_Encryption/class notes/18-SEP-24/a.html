<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS SELECTOR</title>
    <style>
      /* css selector 
      selector are case sensitive  
      
    universal selector
    => selector all element
    syn :-
        
        * {
        prop:val;
        prop:val;
        prop:val;
        ....
        ...
    
        }
    tag selector
    =>common styles for all element/instance of specific tag 
    syn :-
        
        * /tag{
        prop:val;
        prop:val;
        prop:val;
        ....
        ...
    
        }
    
    id selector
    => styles for 1 element/instance of specific tag inline style
      => mapping is important
      <tag id="id-name"
      cant repeat same id in two tag 
      and one one tag cnt have 2 id     <div id="q1 "q2"></div>
    syn :-
        
        #id-name{
        prop:val;
        prop:val;
        prop:val;
        ....
        ...
    
        }
         mapping 
     class selector
      . 
      => styles for group element/instance or common style for group of tag 
      => mapping is important
      <tag class="class-name"
      can repeat same class in two tag 
      and one one tag have 2 class     <div class="q1 "q2"></div>
    syn :-
        
        .class-name{
        prop:val;
        prop:val;
        prop:val;
        ....
        ...
    
        }
         mapping

         child selector
        gp_tag p_tag c_tag{
                prop:val;
                prop:val;
                prop:val;
                ....
                ...
    
        }
         direct child  selector
         ==> comm style ONLY DIRECT CONNETION 
        gp_tag > p_tag > c_tag{
                prop:val;
                prop:val;
                prop:val;
                ....
                ...

                
    
        }
        
        attribute selector 
        ==> common style for element based on attribute
        syn:-
            [attribute name]
            {
                prop:val;
                prop:val;
                prop:val;
                prop:val;
                .....
                ...
                .
            }
        pseudo selector 
        ==>  
        syn:-
            :pseudo-ele
            {
                prop:val;
                prop:val;
                prop:val;
                prop:val;
                .....
                ...
                .
            }
            
         
    */
      /* *{

      div {
        width: 100px;
        height: 100px;
        background: #22ff66;

      }
      /* body{

      #q1 {
        width: 100px;
        height: 10px;
        background: black;
        display: inline-block;
      }
    </style>
  </head>
