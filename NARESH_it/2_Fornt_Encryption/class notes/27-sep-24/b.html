<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEY FRAME</title>
    <style>
        @keyframes spin {
            0%{
                top: 1px;
                left: 1px;
            }
            100%{ transform: rotate(360deg);
                top: 1;
                left: 1000px;
            }         
        }
        .loader{
        width: 150px;
        height: 150px;
        border: 30px solid #2390ED;
        border-top: 30px solid #21c6f6;
        /* border-radius: 50%; */
        animation: spin 7s linear infinite;
        position: absolute;
        font-size: 150%;
    }
    </style>
</head>
<body>
    <div class="loader">DASTAN Alam</div>
    
</body>
</html>
