<html lang="en">
<head>

<body>
    <h2>demo on IE/II function</h2>
    <script>
        
        (function(){
            document.write(`hi i am ie expr fun<br>`)
        })();

        (()=>{
  document.write(`hi i am ie arrow fun<br>`)
})();

((x,y)=>{ document.write(`sum is {x+y}<br>`)})(10,20);
        


    </script>
