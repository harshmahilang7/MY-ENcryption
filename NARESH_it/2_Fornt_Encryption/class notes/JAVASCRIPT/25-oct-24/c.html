  <head>
    <script>
        //only take 3 parameter 
        // const sum=function(x,y,z)
        // {
        //     return x+y+z;
        // }
        const sum=function(...n)
        {
            let s=0;
            // n.forEach((e)=>{s=s+e});
            n.forEach(e=>s+=e);
            return s;
        }
    </script>
  </head>
<h3>demo on rest params</h3>
<!-- one function can get one rest paramater only but can have normal para maber -->
 <!-- eg function(x,y,...n) valid rest paramater on last -->
 <!-- eg function(...n,y,x) error rest para mater can only in last -->
<script>
    document.write(`${sum(1,2,3,4,"ram",5,6)}<br>`);
    document.write(`${sum()}<br>`);
    document.write(`${sum(12,33,55)}<br>`);
    document.write(`${sum(3,8)}<br>`);
</script>
