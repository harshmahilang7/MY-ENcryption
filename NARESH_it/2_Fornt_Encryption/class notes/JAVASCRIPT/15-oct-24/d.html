<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if-else</title>
</head>
<body>
    <!-- example on constrol stament-->
     <h3>Demo On if-else</h3>
     <script>
         // checking is even or odd
         let x=prompt("enter any number")
         // pasreint is not requied
         if (x%2===0) {
            // use === for accuracy not use ==
             document.write(x+" is  even");
        }
        
        else document.write(x+" is  odd");
        
     </script>
</body>
</html>
