<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switch</title>
</head>
<body>
    <!-- example on constrol statemats -->
    <h3>Demo on switch</h3>
    <script>
        let d=+prompt("enter value b/w 1 to 7");
        switch (d) {
            case 1:
                document.write("SUNDAY");
                break;
            case 2:
                document.write("MONDAY");
                break;
            case 3:
                document.write("TUESDAY");
                break;
            case 4:
                document.write("WESNESDAY");
                break;
            case 5:
                document.write("THUSDAY");
                break;
            case 6:
                document.write("FRIDAY");
                break;
            case 7:
                document.write("SATURDAY");
                break;
            default:
                document.write("invalid");
                break;
        }

        
    </script>

    
</body>
</html>
