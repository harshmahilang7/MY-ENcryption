    <title>if-else-if</title>
  </head>
  <body>
    <!-- example on constrol stament-->
    <h3>Demo On if-else-if</h3>
    <!-- if-else-if check multi-level condition-->
    <script>
         // checking is even or odd
         let z=+prompt("enter any number")
         // pasreint is not requied
         if (z%2===0) {
            // use === for accuracy not use ==
             document.write(z+" is  even");
        }
        else if(Number.isNaN(z))
        {
            document.write(z+" is  invalid");
        }
        
        else document.write("odd");

    </script>
