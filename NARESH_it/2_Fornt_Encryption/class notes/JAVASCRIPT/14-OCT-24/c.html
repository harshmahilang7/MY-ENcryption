<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            display: inline;
            /* padding-top: 7px; */
        }
        input{
            text-align: center;
        }
    </style>
</head>
<body>
    <div align="center">
    <h2>temperature Converter</h2>
    <input type="text" name="" id="celsius" placeholder="Degree celsius" oninput="Fahrenheit.value=celsius.value*9/5+32">
    <h1>=</h1>
    <input type="text" name="" id="Fahrenheit" placeholder="Fahrenheit" oninput="celsius.value=(Fahrenheit.value-32)*5/9">
        
    </div>
    <br><hr>
    <div align="center">
    <h2>Spped Converter</h2>
    <input type="text" name="" id="KM" placeholder="Enter the KM" oninput="Miles.value=KM.value/1.6">
    <h1>=</h1>
    <input type="text" name="" id="Miles" placeholder="Enter the Miles" oninput="KM.value=Miles.value*1.6">
        
    </div>
</body>
</html>
