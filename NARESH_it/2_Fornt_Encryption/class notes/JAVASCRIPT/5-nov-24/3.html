<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="display: flex; justify-content: space-between;">
        <h1 id="d">Date</h1>
        <h1 id="t">Time</h1>
    </div>
    <script>
        document.querySelector("#d").innerText=new Date().toLocaleDateString();

        // displaying digital class 

        // windows is optional in window.setInterval(()
        window.setInterval(()=>document.querySelector("#t").innerText=new Date().toLocaleTimeString(),1000);
        

        
    </script>

    <br>
    
    <div id="div2" style="width: 100%; height: 200px; background-color: black;">
    </div>

    <p align="center">
        <button id="start">Start Coloure</button>
        <button id="stop">Stop Coloure</button>
    </p>

    <script>
        let timerIndex=0;
        document.querySelector("#start").onclick=function(){
            timerIndex=setInterval(function()
            {
            let c=`#${Math.random()*1000000|0}`
            document.querySelector("#div2").style.background=c;
            }
            ,"300");
        }
        
        document.querySelector("#stop").onclick=()=>clearInterval(timerIndex);
        
        // 
    </script>
</body>
</html>
