    <script>
      function printTable() {
        let n, res; // local vars
        n = +tn.value;
        op.innerHTML = "";
        if (!Number.isNaN(n)) {
          // if (isNaN(n)===false)
          for (let i = 1; i <= 20; i++) {
            //  i is the block level varable
            res = n * i;
            // document.write(n+" * "+i+" = "+res+"<br>");
            op.innerHTML += n + " * " + i + " = " + res + "<br>";
          }
          //   op.innerHTML += n + " * " + i + " = " + res + "<br>";
        } 
        else 
        {
            //op.innerHTML = "not a number <br>";
            alert("enter a number only");
        }
      }
    </script>
