<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>demo on element object properties (data )</h3>
    <div id="div1"></div>
    <br>
    <div id="div2"></div>
<hr>
    <script>
        const d1=document.querySelector("#div1");
        const d2=document.querySelector("#div2");

        d1.innerText="apple <b style= 'color:red;'>&#8377;200</b> per kg";   ///only the text 
        d2.innerHTML="apple <b style= 'color:red;'>&#8377;200</b> per kg";   // it is working html tag and css 
    </script>
</body>
</html>
