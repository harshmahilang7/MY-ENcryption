<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <h2>demo on object literal</h2>
        <script>
            const imgs=[
                {src:'a.jpg',width:100,height:100},
                {src:'b.jpg',width:100,height:100},
                {src:'c.jpg',width:100,height:100}
        ]
        
        imgs.forEach((i)=>{
          document.write(`${i.src} &nbsp;${i.width} &nbsp;${i.height} <br>`)  
        })
        </script>
    </body>
</html>
