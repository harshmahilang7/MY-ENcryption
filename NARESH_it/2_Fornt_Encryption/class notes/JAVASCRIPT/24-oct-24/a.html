  <body>
    <h2>demo on expr function</h2>
    <script>
        document.write(`${add}<br>`);
        document.write(`${add(10,20)}<br>`);                  //calling
        document.write(`${product(10,20)}<br>`);              //calling

        const eles=[56,100,9,70,20];

        // forEach()  => Array/coll  is is not loop it is just a function
        
        // forEach( function(){} ); 
        
        // eles.forEach(document.write());
        eles.forEach( 
            function(a)
            {
                console.log('hii');
                document.write(`${a} &nbsp; `);
            }
        ); 
        document.write('<br>');
        eles.sort();
        document.write(`${eles}<br>`);
        //100,20,56,70,9  sort like string 1 then 2 then 3  so 100 then 20 then 56  and so on.
        eles.sort(
          function(i,j)
          {
            return i-j;
          }
        );
        document.write(`${eles}<br>`);
        
        </script>
