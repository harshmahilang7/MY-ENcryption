<head>
    <script>
        //only take 3 parameter 
        const sum=function(x=0,y=0,z=0)
        {
            return x+y+z;
        }
        // x=0 in paramater is default value of the x
        // it is vaild of only one varable have default value   => function(x,y,z=0)
        // right side para is suggest default
    </script>
  </head>
<h3>demo on params default value</h3>
<script>
    document.write(`${sum(1,2,3,4,"ram",5,6)}<br>`);
    document.write(`${sum()}<br>`);
    document.write(`${sum(12,33,55)}<br>`);
    document.write(`${sum(3,8)}<br>`);
</script>
