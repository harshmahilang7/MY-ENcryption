<hr>
<script>
    //object init
    const stud={
        slno:1,
        name:'ram',
        couse:'javascript',
    }
    document.write(`${stud}<br>`);
    document.write(`slno : ${stud.slno}<br>`);
    document.write(`name : ${stud.name}<br>`);
    document.write(`couse : ${stud.couse}<br>`);
</script>
