<script>
    const eles=[10,20,39,40,50,60,79,70]
    const names=['rama','ramarao','Ramana','raman','Ramakrishna','ramanaidu','ramaswamy']
    names.sort()
    document.write(`name => ${names}<br>`)


    // join()
    // every Element it will join 
    document.write(`name => ${names.join("<br>")}<br>`)


    //toString()
    // convert array into string  
    // see on console
    document.write(`name => ${eles.toString()}<br>`)
</script>
