<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <input type="text" id="tb" placeholder="enter the number only"><br>
        <button onclick="addelement()">add element</button>
        <button onclick="display()">view element</button>
        <h3>element</h3>
        <output id="op"></output>


        <script>
            const eles=[];
            function addelement()
            {
                let n=+tb.value;
                // if()
                eles.push(n);
                tb.value="";
                tb.focus();  // auto focus
            }
            
            function display() {
                op.value=eles.join(" ");
            }
        </script>
    </body>
</html>
