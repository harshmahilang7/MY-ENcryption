<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <h3>demo on non Primitive datatype</h3>
        <script>
            // object craeation and init with defult value
            var st= new String();
            var b= new Boolean();   //false
            var d= new Date();
            const a = [];
            document.write(st,'=>',typeof st,"<br>");
            document.write(b,'=>',typeof b,`<br>`);
            document.write(d,'=>',typeof d,"<br>");
            document.write(a,'=>',typeof a,"<br>");
        </script>
    </body>
