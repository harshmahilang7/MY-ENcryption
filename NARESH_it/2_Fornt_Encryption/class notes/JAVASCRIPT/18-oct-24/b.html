<h3>demo on array literal</h3>
<script>
    let a=[];     //arrays declaration
    // default size of arrays is zero;
    
    document.write(`size ${a.length} <br>`)
    document.write(`size ${a} <br>`)


    a[0]=12;
    a[1]=45;
    a[2]=22;
    
    document.write(`size ${a.length} <br>`);
    document.write(`size ${a} <br>`);
    

    let b=[5,2,3,4,4];             //array init
    
    document.write(`size ${b.length} <br>`);
    document.write(`size ${b} <br>`);
</script>
