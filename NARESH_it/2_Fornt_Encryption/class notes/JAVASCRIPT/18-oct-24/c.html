<h3>demo on arrays constructor</h3>
<script>
    let a=new Array();  //arrays declaration
    // default size of arrays is zero;
    
    document.write(`size ${a.length} <br>`)
    document.write(`size ${a} <br>`)
    
    
    a[0]=12;
    a[1]=45;
    a[5]=22;
    
    document.write(`size ${a.length} <br>`);
    document.write(`size ${a} <br>`);
    

    let name=new Array("ram",'sham','gama','bhama');  //array init
    
    document.write(`size ${name.length} <br>`);
    document.write(`name ${name} <br>`);
</script>
