<!-- Q 3) Create following sign-up form using all HTML5 form elements : -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Student Sign-up Form</h1>
        <fieldset>
        <legend>Personal infomation</legend>
        <form action="">
            <label for="un">first name:</label>
            <input type="text" name="" id="un">
            <br><br>
            <label for="ps">last name</label>
            <input type="text:" name="" id="ps">
            <br><br>
            <label for="gen">gender</label><br>
            <input type="radio" name="gen" id="gn">male <br>
            <input type="radio" name="gen" id="ge">female
            <br>
            <label for="db">Date of Birth</label>
            <input type="date" name="" id="db">
            <br><br>
            <label for="em">Email:</label>
            <input type="email" name="" id="em">
            <br><br>
            <label for="pn">Phone Number:</label>
            <input type="tel" name="" id="">
            <br><br>
        </form>
       </fieldset>
       <fieldset>
        <legend>academic infomation</legend>
        <form action="">
            <label for="gy">Grade/Year:</label>
            <input type="text" name="" id="gy" maxlength="4" size="1">
            <br><br>
            <label for="c">Course</label>
            <select name="" id="c">
                <option value="science">science</option>
                <option value="math">math</option>
                <option value="hindi">hindi</option>
            </select>
            <br><br>
            <label for="in">Interests:</label><br>
            <input type="checkbox" name="" id="in">sport <br>
            <input type="checkbox" name="" id="in">music <br>
            <input type="checkbox" name="" id="in">reading <br>
        </form>
       </fieldset>
       <fieldset>
        <legend>Account Setup</legend>
        <form action="">
            <label for="un">Username:</label>
            <input type="text" name="" id="un">
            <br><br>
            <label for="ps">pasword</label>
            <input type="password:" name="" id="ps">
            <br><br>
            <label for="ps">Conform pasword</label>
            <input type="password:" name="" id="ps">
            <br><br>
       </fieldset>
       <input type="submit" value="Login">
       </form>
    </body>
</html>
