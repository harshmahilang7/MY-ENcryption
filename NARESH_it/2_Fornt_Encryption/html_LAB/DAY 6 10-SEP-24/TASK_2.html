<!--Q 2) Write an HTML code to demonstrate the use of all HTML5 form controls :-->
<html>
  <head>
    <title>task 2</title>
  </head>
  <body>
    <form action="">
      <h1>HTML Input Type Demonstration</h1>
      <label for="t1"> text Input</label>
      <input type="text" id="t1" placeholder="enter text" />
      <br /><br />
      <label for="t2"> pasword Input</label>
      <input type="pasword" id="t2" placeholder="enter pasword" />
      <br /><br />
      <label for="t3"> email Input</label>
      <input type="email" id="t3" placeholder="enter email" />
      <br /><br />
      <label for="t11"> url Input</label>
      <input type="url" id="t11" placeholder="enter url" />
      <br /><br />
      <label for="t10"> telephone Input</label>
      <input type="telephone" id="t10" placeholder="9876-5443-21" />
      <br /><br />
      <label for="t9"> search Input</label>
      <input type="search" id="t9" placeholder="enter search" />
      <br /><br />
      <label for="t4"> number Input</label>
      <input
        type="number"
        id="t4"
        placeholder="enter number"
        min="0"
        max="50"
      />
      <br /><br />
      <label for="t8"> range Input</label>
      <input type="range" id="t8" placeholder="enter range" />
      <br /><br />
      <label for="t5"> date Input</label>
      <input type="date" id="t5" placeholder="enter date" />
      <br /><br />
      <label for="t6"> time Input</label>
      <input type="time" id="t6" placeholder="enter time" />
      <br /><br />
      <label for="t61"> week Input</label>
      <input type="week" id="t61" placeholder="enter time" />
      <br /><br />
      <label for="t612"> month Input</label>
      <input type="month" id="t612" placeholder="enter month" />
      <br /><br />
      <label for="t6123">datetime-local Input</label>
      <input type="datetime-local" id="t6123" placeholder="enter month" />
      <br /><br />
      <label for="t7"> color Input</label>
      <input type="color" id="t7" placeholder="enter color" />
      <br /><br />
      <label for="t12"> file Input</label>
      <input type="file" id="t12" placeholder="enter file" />
      <br /><br />
      <label for="t13"> checkbox Input</label>
      <input type="checkbox" id="t13" />i agree <br /><br />
      <label for="t13"> radio Input</label>
      <input type="radio" id="t13" />option 1
      <input type="radio" id="t13" />option 2 <br /><br />
      <label for="browsers">Datalist (with suggestions):</label>
      <input list="browsers" id="browser" name="browser" />

      <datalist id="browsers">
        <option value="Chrome"></option>
        <option value="Firefox"></option>
        <option value="Opera"></option>
        <option value="Safari"></option>
        <option value="Edge"></option>
      </datalist>

      <br /><br />
      <label for="dropdrwn">select Dropdrows:</label>

      <select name="dropdrwn" id="dropdrwn">
        <option value="option_1">otion_1</option>
        <option value="option_2">option2</option>
        <option value="option_3">option_3</option>
        <option value="option4">option_4</option>
      </select>
      <br /><br />
      <label for="t12345"> Textarea Input</label>
      <textarea id="t12345" placeholder="Textarea" rows="3" col="5"></textarea>
      <br /><br />

      <input type="submit" value="Submit" /><br />
    </form>
  </body>
</html>
