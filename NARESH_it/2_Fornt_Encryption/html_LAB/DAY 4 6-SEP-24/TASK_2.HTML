<!--Q 2) Write an HTML code to demonstrate the use of fieldset Element : 
-->
<!DOCTYPE html>
<html>
  <head>
    <title>fieldset Element</title>
  </head>
  <body>
    <h1>Fieldset Example: Colors and Sports</h1>
    <fieldset>
      <legend>list of colurs</legend>
      <ul>
        <li>red</li>
        <li>blue</li>
        <li>yellow</li>
        <li>orange</li>
        <li>purple</li>
        <li>black</li>
        <li>white</li>
      </ul>
    </fieldset>

    <fieldset>
      <legend>list of sports</legend>
      <ol>
        <li>soccer</li>
        <li>Basketball</li>
        <li>cricket</li>
        <li>tennis</li>
        <li>badminton</li>
        <li>hockey</li>
        <li>swimming</li>
      </ol>
    </fieldset>
  </body>
</html>
