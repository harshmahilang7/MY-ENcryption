<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- Q 4)
	Create a Color Changer
	Add a dropdown with color options (e.g., Red, Blue, Green) and a "Change Color" button.
	Implement a function changeColor() that:
		- Reads the selected color from the dropdown.
		- Changes the background color of a target element on the page to the selected color. -->
    <h1>Color Changer</h1>
    <select name="color" id="cc">
        <option value="red">red</option>
        <option value="blue">BLUE</option>
        <option value="green">green</option>
    </select>
    <button onclick="addcolour()">add colour</button>
    <br>
    <div id="div" style="height: 200px;"></div>

    <script>
        function addcolour()
        {
            let c=document.getElementById("cc").value;
            document.querySelector("#div").style.backgroundColor=c;
        }
        
    </script>
    
</body>
</html>
