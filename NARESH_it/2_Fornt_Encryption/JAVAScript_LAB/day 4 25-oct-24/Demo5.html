<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let a = Number(prompt("Enter a Number"));
      let evenSum = 0;
      let oddSum = 0;
      if (a < 0) {
        alert("Invalid input ");
      } else {
        for (let i = 1; i <= a; i++) {
          if (i % 2 == 0) {
            evenSum += i;
          } else {
            oddSum += i;
          }
        }
        document.write("even sum => " + evenSum);
        document.write("odd sum => " + oddSum);
      }
    </script>
  </body>
</html>
