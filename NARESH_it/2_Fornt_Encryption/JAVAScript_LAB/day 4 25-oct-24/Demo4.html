<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="number" id="number" placeholder="Enter a Number" />
    <br />
    <button onclick="displayTable(number.value)">Display Table</button>
    <output id="op"></output>
    <script>
      function displayTable(num) {
        for (let i = 1; i <= 10; i++) {
          let table = num * i;
          document.write(`${num} x ${i} = ${table} <br>`);
        }
      }
    </script>
  </body>
</html>
