<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculate Profit or Loss</title>
  </head>
  <body>
   

      <input type="number" name="costp" id="c" placeholder="enter the cost price"/>
      <input type="number" name="sellingp" id="sp" placeholder="enter the sell price"/>
      <input type="number" name="output" id="op" readonly/>
      <input type="number" name="output" id="op100" readonly placeholder="Total Loss on 100 units"/>
      <button onclick="calculateProfitorLoss()">calculate</button>



	<script>
		function calculateProfitorLoss() {
	
			//let sp =Number(sp.value);
			 let selling = Number(sp.value);
			 let cp =Number(c.value);
			 op.value= (selling-cp);
			 op100.value=(selling-cp)*100;
      }
    </script>
  </body>
