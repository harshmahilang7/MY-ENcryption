<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            
// Q 2) 
	// write a JavaScript program to find the second max element in an array.
    let a=[1,2,3,4,6,9,14,5,8,7];
    let i,j;
    for (i = 0;i < a.length; i++) {
        for (j = i+1; j < a.length; j++) {
            if(a[j]<a[i])
        {
            let temp=a[j]
            a[j]=a[i]
            a[i]=temp;
        }
            
        }
        
    }  
    document.write(a[(a.length-2)]);      
    </script>
    </body>
</html>
