<!DOCTYPE html>
<html lang="en">

        <meta charset="utf-8">

    <body>
        <script>
            // Q 4) 
	// Write a JavaScript program to remove the element from given index from array.
    let a=[1,2,3,4,5,6,7,8,9]
            let index=3-1;
            // let del_ele=3;
            
            for(let i=index;i<a.length;i++)
        {
            a[i]=a[i+1]
        }
            document.write(a);     
        </script>
