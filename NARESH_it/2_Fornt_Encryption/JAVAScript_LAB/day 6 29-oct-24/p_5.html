<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      // Q 5)
      // write a JavaScript program to create mixed array of 20 elements and separate the integers and strings in separate arrays.
      let a = [
        1,
        3,
        4,
        5,
        6,
        7,
        8,
        9,
        0,
        2,
        "hasrh",
        "dastan",
        "verr",
        "hello",
        "pakiza",
        "yesh",
        "minu",
        "lol",
        "9",
        "pollball",
      ];

      let integers = [];
      let string = [];
      let j = 0;
      k = 0;
      for (let i = 0; i < a.length; i++) {
        if (typeof a[i] === "number") {
          integers[j] = a[i];
          j++;
        } else if (typeof a[i] === "string"){
          string[k] = a[i];
          k++;
        }
      }

      document.write(a);
      document.write("<br>");
      document.write(integers);
      document.write("<br>");
      document.write(string);
      document.write("<br>");
    </script>
  </body>
</html>
