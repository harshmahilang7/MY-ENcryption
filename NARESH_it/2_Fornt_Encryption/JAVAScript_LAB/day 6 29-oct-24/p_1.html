<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            // Q 1) 
            // write a JavaScript program to create an array of 10 elements(string) and print them using for-each loop.
            let str=['a','b','c','d','e','f','g','h','i','j']
            str.forEach(element => {
                document.write(element)
            });
        </script>
