<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      // Q 6)
      // write a JavaScript program to create array of 10 image names and display those images on webpage.

      let images = [
        "/imge/1 (1).jpg",
        "/imge/1 (2).jpg",
        "/imge/1 (3).jpg",
        "/imge/1 (4).jpg",
        "/imge/1 (5).jpg",
        "/imge/1 (6).jpg",
        "/imge/1 (7).jpg",
        "/imge/1 (8).jpg",
        "/imge/1 (9).jpg",
        "/imge/1 (10).jpg",
      ];

      for (let i = 0; i < images.length; i++) {
        document.write(`<img src="${images[i]}" alt="" srcset="" ><br><span>${i}<span><br>`);
      }
    </script>
  </body>
</html>
