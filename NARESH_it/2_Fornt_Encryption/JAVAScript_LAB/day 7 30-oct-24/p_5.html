<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            // Q 5) 
	// write a JavaScript program to print the multiplication table of a given number using arrow function.
    const tablePrint=(x)=>{
        
        for (let i = 0; i <= 10; i++) {
            document.write(`${x} X ${i} = ${x*i}<br>`);   
        }
    }
    tablePrint(5);
        </script>
    </body>
</html>
