<!-- Q 2) 
Write a JavaScript program to print student details using the document.write() function only.

Sample Output :

Name = Raj Malhotra
Roll No = 101
Branch = CSE
Address = Hyderabad
College Name = Naresh It

============================================================================================================= -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      document.write("Name = Raj Malhotra<br>");
      document.write("Roll No = 101<br>");
      document.write("Branch = CSE<br>");
      document.write("Address = Hyderabad<br>");
      document.write("College Name = Naresh It<br>");
    </script>
  </body>
</html>
