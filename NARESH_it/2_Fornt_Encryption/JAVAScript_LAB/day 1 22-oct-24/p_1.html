<!-- Q 1) 
Write a JavaScript program to print student details using the console.log() function only.

Sample Output :

Name = Raj Malhotra
Roll No = 101
Branch = CSE
Address = Hyderabad
College Name = Naresh It
========================================================================================================= -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      console.log("Name = Raj Malhotra");
      console.log(" No = 101");
      console.log("Branch = CSE");
      console.log("Address = Hyderabad");
      console.log("College Name = Naresh It");
    </script>
  </body>
</html>
