<!-- Q 10) 
Write a JavaScript program to determine the next or previous multiple of 10 for a given two-digit number. The program should 	follow 	these rules:

1) If the last digit of the number is greater than or equal to 5, print the next multiple of 10.
2) If the last digit of the number is less than 5, print the previous multiple of 10.

Sample Inputs and Outputs:
    Input1: 34 → Output1: 30
    Input2: 25 → Output2: 30
    Input3: 86 → Output3: 90
================================================================================================================================== -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      let x = prompt("Enter a 2-digit number:");

      if (x % 10 > 5) {
        document.write(`Enter a 2-digit number:${x}<br>`);
        let y = parseInt(x / 10 + 1) * 10;
        document.write(`Previous multiple of 10 is:${y}<br>`);
      } else {
        document.write(`Enter a 2-digit number:${x}<br>`);
        let y = parseInt(x / 10) * 10;
        document.write(`Previous multiple of 10 is:${y}<br>`);
      }
    </script>
  </body>
</html>
