<!-- Q 4) Write a JavaScript program to declare and initialize two variables like let a = 20, b = 10 and print the addition, subtraction, multiplication, division, and modulus operations.

    Sample Output :

    Addition is : 30
    Subtraction is : 10
    Multiplication is : 200
    Division is : 2
    Modulus is : 0
============================================================================================================== -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      let a = 20,
        b = 10;
      document.write(`Addition is :${a + b}<br>`);
      document.write(`Subtraction is :${a - b}<br>`);
      document.write(`Multiplication is : ${a * b}<br>`);
      document.write(`Division is :${a / b}<br>`);
      document.write(`Modulus is :${a % b}<br>`);
    </script>
  </body>
</html>
