<!-- Q 6) Write a JavaScript program to print the sum of the first and last digit of any given 2-digit number.
    
Sample Input :
let number = 23;

Sample Output :
Addition of two digit number is : 5

=============================================================================================================== -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let num=23,f_n,l_n;
            f_n=parseInt(num/10);
            l_n=num%10;
            document.write(`Addition of two digit number is : ${f_n+l_n}`);
            
        </script>
    </body>
</html>
