<!-- Q 8) 
Write a JavaScript program to find the previous multiple of 10 of a given 2-digit number. Take the input by prompting the user.

Sample Input :
    Enter a 2-digit number: 26
Sample output :
    Previous multiple of 10 is: 20
================================================================================================================================== -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let x=prompt("Enter a 2-digit number:");
            document.write(`Enter a 2-digit number:${x}<br>`)
            let y=parseInt((x/10))*10;
            document.write(`Previous multiple of 10 is:${y}<br>`)
            
            
        </script>
    </body>
</html>
