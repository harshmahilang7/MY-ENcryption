<!-- Q 5) Write a JavaScript program to print the addition of any two positive numbers without using the + operator.

Sample Input :
let a = 10, b = 20;

Sample Output :
Addition is 30
============================================================================================================== -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let a=10,b=20;
            document.write(`Addition is ${a-(-b)}`)
        </script>
    </body>
</html>
