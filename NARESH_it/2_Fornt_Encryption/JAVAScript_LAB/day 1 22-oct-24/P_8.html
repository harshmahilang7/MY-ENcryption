<!-- Q 7) Write a JavaScript program to calculate and print the area of a square and a rectangle.

Sample Input : 
Side of square is: 5
Length and breadth of rectangle are: 4, 5

Sample Output :

The area of the square with side 5 is: 25
The area of the rectangle with length 4 and breadth 5 is: 20

================================================================================================================ -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let x=prompt("Side of square")
            let l=prompt("lenght of rectangle")
            let b=prompt("breadth of rectangle")

            document.write(`Side of square = ${x}<br>`)
            document.write(`The area of the square with side ${x} is:${x*x}<br>`)
            
            document.write(`Length and breadth of rectangle are:${l},${b}<br>`)
            document.write(`The area of the rectangle with length ${l} and breadth ${b} is:${l*b}<br>`)
        </script>
    </body>
</html>
