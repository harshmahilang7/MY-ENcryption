<!-- Q 1) 
Write a JavaScript program to determine the maximum of two numbers without using if-else, ternary operators, or control statements.

Sample Input :
    Enter a: 10
    Enter b: 20
Sample output :
    MAX = 20
================================================================================================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a JavaScript program to determine the maximum of two numbers without using if-else, ternary operators, or control statements.</title>
</head>
<body>
    <script>
        let a=+prompt("enter the first number");
        let b=+prompt("enter the first number");
        document.write(`a is ${a}<br>`)
        document.write(`b is ${b}<br>`)
        a>b&&document.write(`max is ${a}<br>`)
        a<b&&document.write(`max is ${b}<br>`)
        
        
    </script>
    
</body>
</html>
